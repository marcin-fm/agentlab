name: xberg
status: blocked
blockers:
  - Xberg v1.0.3 is a renamed/new upstream source tree whose selected Fedora surface still lacks final native-link and RPM-payload proof.
  - "The checked six-member Fedora workspace lock vendors 1,034 registry sources and is not final linked-license completeness: 75 source text gaps remain blockers, split into 22 selected-normal and 53 resolver-only identities."
  - Configured-SCM build 10791299 reached the exact Xberg 1.0.3 default-minus-tree-sitter compile, then exposed upstream's incomplete dynamic-Tesseract API gating; the 0.3 correction still needs remote proof.
  - The historical Kreuzberg 4.10.2 and Xberg 1.0.1 receipt sets are not applicable to Xberg v1.0.3.
  - Immutable checksum-verified model downloads are approved only as opt-in content outside the RPM payload; model provenance, offline behavior, and runtime smoke remain incomplete.
  - Tree-sitter is intentionally omitted from the initial RPM pending exact 1.13.5 parser-source, license, and offline x86_64/aarch64 review.
