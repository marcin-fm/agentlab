  rpmlint: Zero errors and zero warnings for the Fedora 44 source and noarch RPMs.
  copr_matrix: pending Fedora 43, Fedora 44, and Rawhide on x86_64 and aarch64
  upstream_tests: unavailable; sdist excludes the test tree
  installed_smokes: base import, expanded service-client exports, client construction, and local HTTP health response
