limitations:
  - The PyPI sdist excludes the upstream test tree.
  - The service client is useful only when an administrator explicitly configures a remote Docling service.
  - Local conversion, model execution, and parser branches are deliberately not provided.
  - Upstream command wrappers are removed because they import the excluded local PDF backend at startup.
  - The service-client extra is patched to represent its API-only imports; the omitted CLI remains a separate unsupported surface.
  - Release 2.117.0 accepts an empty targets list past the None guard, then raises IndexError while selecting first_target before any request is sent; this package does not change that upstream behavior and validates only the exported types and sync/async targets parameter signatures.
