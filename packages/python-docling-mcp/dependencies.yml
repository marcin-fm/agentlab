schema: python-docling-mcp-dependencies/v1
target_release: 2.1.0
status: blocked
build_system:
  backend: hatchling.build
  requirement: hatchling
upstream_runtime_direct:
  - docling-core >= 2.51.0
  - docling-slim[service-client] ~= 2.92
  - httpx >= 0.28.1
  - mcp[cli] >= 1.9.4
  - pydantic ~= 2.10
  - pydantic-settings ~= 2.4
  - python-dotenv >= 1.1.0
upstream_runtime_optional:
  local:
    - docling-slim[standard] ~= 2.92
  broader_groups:
    - llama-index-rag
    - llama-stack
    - smolagents
    - mellea
completed_reusable_packages:
  - python-docling-core 2.88.0
  - python-docling-slim 2.116.0 service-client API
  - python-doclang 0.7.3
  - python-latex2mathml 3.81.0
selected_surface:
  desired: local stdio generation and manipulation MCP server
  upstream_configuration:
    - stdio transport is selectable with --transport stdio
    - generation and manipulation tool groups are selectable as positional arguments
  unresolved_installed_surfaces:
    - the released launcher defaults to streamable HTTP
    - conversion is part of the default tool group set
    - SSE and streamable HTTP transports remain selectable
    - conversion accepts URLs and local paths through remote or optional local converters
    - RAG and local-model extras remain part of the released application design
decision:
  substantive_patches: removed
  binary_build: prohibited
  reenable_when: upstream-supported selected surface and complete Fedora dependency and transport review are proven, or explicit maintainer approval is recorded
