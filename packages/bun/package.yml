name: bun
status: blocked
blockers:
  - Fedora Packaging Committee approval is required before the upstream Bun seed may drive the initial source build.
  - The external lol-html 3.0.0 package and Bun system-link patch require target Mock proof.
  - The complete LGPL relink kit is proven locally but lacks approved immutable delivery and final RPM integration.
  - Six Bun WebKit fork files lack explicit terms, and peechy 0.4.34 omits the required MIT text from its exact npm archive. constants-browserify 1.0.0 carries the complete notice in its exact release README.
  - Final bundled-license accounting, the aarch64 Bun build chain, RPM acceptance, and COPR acceptance are incomplete.
