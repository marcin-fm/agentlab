  commit: 777b8d06710c140e3606b0d4598e2aa48546c266
consumer:
  package: python-headroom-ai
  version: 0.33.0
  repository: chopratejas/headroom
  tag: v0.33.0
  commit: 28aa53dc7ca51e687cc719c3fe160f3be50c6570
  declared_requirement: mcp>=1.28.1,<2.0.0
  upstream_guard:
    commit: b3f016b866375cfe2ff8518055ab93844e11ec27
    evidence: upstream-reported
    failure: "AttributeError: 'Server' object has no attribute 'list_tools'"
    client_failure: "headroom MCP error -32000: Connection closed"
api:
  compatible: false
  headroom_legacy_calls:
    - headroom/ccr/mcp_server.py:612 @self.server.list_tools()
    - headroom/ccr/mcp_server.py:707 @self.server.call_tool()
    - headroom/ccr/mcp_server.py:805 self.server.request_context.session.client_params
    - headroom/ccr/mcp_http.py:34 StreamableHTTPSessionManager(app=server.server)
    - headroom/memory/mcp_server.py:228 @server.list_tools()
    - headroom/memory/mcp_server.py:235 @server.call_tool()
  mcp_2_replacements:
    list_tools: "on_list_tools(ctx: ServerRequestContext, params: PaginatedRequestParams | None) -> ListToolsResult"
    call_tool: "on_call_tool(ctx: ServerRequestContext, params: CallToolRequestParams) -> CallToolResult | InputRequiredResult"
    result_wrapping: low-level automatic handler result wrapping was removed
  streamable_http:
    constructor_removed: false
    migration_requirement: verify session-manager lifecycle and HTTP regressions with the migrated low-level server handlers
  migration_scope:
    - both released Headroom MCP server implementations
    - handler registration, parameters, and result models
    - request-context field names and access
    - streamable HTTP session-manager integration
    - error and protocol behavior tests
protocol:
  compatible_without_consumer_changes: false
  legacy: initialize handshake and push-capable sessions
  mcp_2026_07_28: server/discover replaces initialization and modern sessions remove server push
  websocket_transport: removed in 2.0.0
dependencies:
  selected_1_28_1:
    anyio: ">=4.5"
    httpx: ">=0.27.1,<1.0.0"
    httpx-sse: ">=0.4"
    pydantic: ">=2.11.0,<3.0.0"
    sse-starlette: ">=1.6.1"
    typing-extensions: ">=4.9.0"
    websocket_extra: websockets>=15.0.1
  candidate_2_0_0:
    anyio: ">=4.9; >=4.10 on Python 3.14+"
    httpx2: ">=2.5.0"
    mcp-types: ==2.0.0
    pydantic: ">=2.12.0"
    sse-starlette: ">=3.0.0"
    typing-extensions: ">=4.13.0"
    opentelemetry-api: ">=1.28.0"
    websocket_extra: removed
  provider_availability:
