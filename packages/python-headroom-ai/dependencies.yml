target_release: 0.33.0
production_runtime:
  python:
    - tiktoken >= 0.5.0
    - pydantic >= 2.0.0
    - litellm >= 1.86.2, < 2.0 on Python below 3.14
    - click >= 8.3.3
    - rich >= 13.0.0
    - opentelemetry-api >= 1.24.0
    - ast-grep >= 0.30.0 from the source-built Agentlab system package; no upstream binary wheel is installed
    - pyyaml >= 6.0
    - tomlkit >= 0.13.0, < 1.0
    - mcp >= 1.28.1, < 2.0.0 with httpx, starlette, and uvicorn
    - fastapi >= 0.100 because upstream CLI registration imports proxy request-scope types
  rust_selected:
    - pyo3 >= 0.29, < 0.30 with abi3-py310 and extension-module
    - pyo3-log >= 0.13, < 0.14
    - tokenizers >= 0.22, < 0.23
    - hf-hub >= 0.4, < 0.5 with ureq and rustls-tls
    - tiktoken-rs >= 0.11, < 0.12 using rust-tiktoken-rs0.11
    - fancy-regex >= 0.17, < 0.18 using rust-fancy-regex0.17
    - rusqlite >= 0.31, < 0.32 using system SQLite through a compatibility patch
    - unidiff >= 0.4, < 0.5 using rust-unidiff0.4
    - icu_segmenter 2.2 with compiled_data
    - tree-sitter 0.25.2 and exact Python, JavaScript, TypeScript, Go, Rust, Java, C, and C++ grammar branches
    - md-5 0.10, sha2 0.10, dashmap 6, aho-corasick 1, and http 1
    - Fedora-provided serde, serde_json, bytes, thiserror, tracing, digest, compression, regex, rayon, toml, and blake3 branches
excluded_runtime:
  rust:
    - fastembed, magika, ort, and ort-sys removed from the selected Cargo manifest with the disabled headroom-core ml surface
    - redis removed from the selected Cargo manifest with its unselected optional feature
  python:
    - optional proxy, ML, memory, relevance, image, voice, and other non-mcp extras
build_runtime:
  backend: maturin >= 1.5, < 2.0
  native_extension: crates/headroom-py with no default features and PyO3 feature extension-module
  license_workspace: the published root Cargo workspace contains headroom-core and headroom-py only
  system_libraries:
    - pkgconfig(sqlite3)
  local_packages:
    - python-mcp = 1.28.1
    - ast-grep >= 0.30.0
    - rust-unidiff0.4 = 0.4.0
    - rust-fancy-regex0.17 = 0.17.0
    - rust-tiktoken-rs0.11 = 0.11.0
validation:
  current_draft:
    release: 0.33.0-0.1
    status: static source and selected-graph validation complete; configured-SCM six-cell build required
    static_validation: exact-sdist four-patch zero-fuzz application, selected manifest closure, system ast-grep substitution, and network-isolated source resolution passed
    cargo_resolution: 307 resolved packages; 217 unique package/version records across 391 target-all normal tree entries
    source_license_probe: headroom-0.33.0-selected-cargo-license-audit.json records all 217 selected package/version/license tuples and the regex-syntax Unicode supplement at SHA-256 3f8a0af6f859a553b6619b531c000dc805a4a8ba785e60768d1343faad2b2d71
    candidate_license: Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND CDLA-Permissive-2.0 AND ISC AND MIT AND MPL-2.0 AND Unicode-3.0 AND Unicode-DFS-2016
    unicode_license_probe: regex-syntax 0.8.11 includes generated Unicode tables and LICENSE-UNICODE while declaring only MIT OR Apache-2.0 in Cargo metadata
    buildroot_license_gate: target builds must normalize cargo2rpm's headroom-core sibling path, compare all 217 LICENSE.dependencies records with checked Source1, and install the verified regex-syntax Unicode text
    system_sqlite_gate: target checks must prove the Rust CCR test binary links Fedora libsqlite3 and the installed Python SQLite backend opens a database
    installed_smoke_gate: target checks must verify PyInit__core and import the buildroot package in safe-path mode before running the installed CLI help path
    required_target_checks: Cargo tests, linked-license inventory, system SQLite, extension ELF, installed import and CLI, and the complete six-cell matrix
  prior_release_0_1:
    fedora_43:
      mock: passed
      native_tests: 836 library, 7 CCR backend, and 2 tokenizer property tests passed; 1 ignored
      mcp: initialize, exact three-tool list, compression, retrieval, local miss, and statistics passed
    fedora_44:
      mock: passed
      native_tests: 836 library, 7 CCR backend, and 2 tokenizer property tests passed; 1 ignored
      mcp: initialize, exact three-tool list, compression, retrieval, local miss, and statistics passed
