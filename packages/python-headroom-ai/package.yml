name: python-headroom-ai
status: enabled
blockers: []
dependency_status:
  python_runtime:
    - tiktoken >= 0.5
    - pydantic >= 2
    - litellm >= 1.86.2, < 2 on Python below 3.14
    - click >= 8.3.3
    - rich >= 13
    - opentelemetry-api >= 1.24
    - ast-grep >= 0.30 from the source-built Agentlab system package; upstream's compromised PyPI 0.44.1 wheel is not used
    - pyyaml >= 6 and tomlkit >= 0.13, < 1
    - mcp >= 1.28.1, < 2 from the source-built Agentlab python-mcp package, with httpx, starlette, and uvicorn
    - fastapi >= 0.100 for the upstream CLI registration import path
  native_runtime:
    - PyO3 0.29 and pyo3-log 0.13
    - tokenizers 0.22.2 from Fedora on 43/44 and rust-tokenizers0.22 on Rawhide, plus hf-hub 0.4
    - tiktoken-rs 0.11 through rust-tiktoken-rs0.11 and fancy-regex 0.17
    - rusqlite 0.31 against system SQLite through a Fedora compatibility patch
    - unidiff 0.4 from the completed rust-unidiff0.4 package
    - ICU4X segmenter 2.2 with compiled data for CJK text boundaries
    - tree-sitter 0.25.2 from rust-tree-sitter0.25.2 plus the eight exact Fedora grammar branches selected by headroom-core
    - md-5 0.10, sha2 0.10, dashmap 6, aho-corasick 1, and http 1
  excluded_surfaces:
    - headroom-core ml feature, including fastembed, Magika, and ORT, removed from selected Cargo metadata
    - optional Rust Redis feature removed from selected Cargo metadata
duplicate_check:
  checked: "2026-07-30"
  fedora_43_44: absent
  fedora_rawhide: absent
  rpm_fusion_43_44: absent
  rpm_fusion_rawhide: absent
network_policy:
  selected_surface: upstream base project plus the mcp extra; no downstream command or transport restrictions
  transport: upstream mcp command supports stdio and streamable HTTP at runtime
  proxy: upstream proxy and fallback paths remain available at runtime
  update_check: upstream CLI behavior remains available at runtime
  file_read: upstream opt-in file-read behavior remains available at runtime
  model_assets: native ml feature is disabled; the selected tokenizer closure retains upstream hf-hub capability
  rpm_build: offline after source and dependency acquisition
build_validation:
  release: 0.33.0-0.4
  status: source audit and exact Fedora-family linked-license contracts complete; configured-SCM six-cell build required
  source_sha256_verified: true
  source_size: 2462330
  exact_sdist_patch_apply: four patches passed with zero fuzz
  cargo_metadata: headroom-py disables headroom-core default features and the selected manifest omits unselected ML and Redis dependency declarations
  upstream_workspace: the published sdist already limits the root workspace to headroom-core and headroom-py
  ast_grep_provider: upstream PyPI binary-wheel dependency is replaced by the source-built Agentlab ast-grep executable
  cargo_resolution: rusqlite 0.31.0 with libsqlite3-sys 0.28.0
  sqlite_source_review: v0.31.0 to v0.32.0 changes only the backend TTL documentation, not its rusqlite API use
  license_workspace: headroom-core and headroom-py only; unrelated proxy, simulator, parity, ML, AWS, and HTTP members are excluded
  cargo_resolution_records: 307 packages resolved; 217 unique package/version records across 391 target-all normal tree entries
  selected_new_dependencies: ICU4X segmenter data, tree-sitter language grammars, crypto hashes, dashmap, aho-corasick, and http
  tree_sitter_provider: exact rust-tree-sitter0.25.2 = 0.25.2 is published on all configured targets
  tokenizers_provider: Fedora 43/44 provide 0.22.2; Rawhide requires rust-tokenizers0.22 = 0.22.2 before Headroom is rebuilt
  candidate_license: Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND CDLA-Permissive-2.0 AND ISC AND LicenseRef-Fedora-Public-Domain AND MIT AND MPL-2.0 AND Unicode-3.0 AND Unicode-DFS-2016 AND Zlib
  selected_license_audit_file: headroom-0.33.0-selected-cargo-license-audit.json
  selected_license_audit_sha256: 3f8a0af6f859a553b6619b531c000dc805a4a8ba785e60768d1343faad2b2d71
  selected_license_records: 217
  fedora_license_contract_file: headroom-0.33.0-fedora-license-contract.json
  fedora_license_contract_sha256: 4dbc7e06524b52b997d74cbbcf847e2988c807630544ffb42301b704eae27738
  fedora_linked_license_records: 172 per family, architecture-identical
  fedora_family_record_sha256:
    "43": 261fff0ffc64c0704b89a3e95daa89380a519bc53682f07a4c89b326934c7b45
    "44": 405798ed561507c67423ebb6227faaf973a054f267b8c01e7d868b1019aadd96
    "45": b490d0f022f657589341c881e46c22b8305e3109fe4c82a7379a3fa700ea8119
  unicode_license_probe: regex-syntax 0.8.11 bundles generated Unicode tables; the spec verifies src/unicode_tables/LICENSE-UNICODE at SHA-256 74db5baf44a41b1000312c673544b3374e4198af5605c7f9080a402cec42cfa3 and installs it separately
  buildroot_license_gate: configured target builds retain Source1 as the 217-record all-target audit, normalize cargo2rpm's one sibling-workspace path, compare the complete 172-record linked set with Source2, and retain Unicode-DFS-2016 because Cargo metadata under-reports regex-syntax
  license_macro_redirection: canonical braced cargo_license expansion writes the root LICENSE.dependencies payload
  system_sqlite_gate: target checks require the Rust CCR test binary to link Fedora libsqlite3 and the installed Python backend to open a database
  extension_dynamic_gate: target checks reject RPATH or RUNPATH on the extension; unused Rust CCR code may be dead-stripped from that binary
  installed_smoke_gate: target checks verify PyInit__core, import headroom and headroom._core in safe-path mode, and run installed headroom --help
  required_target_checks:
    - verify the checked Source1 all-target audit still contains the exact 217 selected source records
    - compare the complete target-generated linked record set with the exact 172-record Fedora-family contract
    - run headroom-core Cargo tests with default features disabled
    - prove system SQLite linkage and installed Python SQLite operation
    - reject extension RPATH or RUNPATH and verify PyInit__core
    - import the installed package and run headroom --help
    - complete Fedora 43, Fedora 44, and Rawhide on x86_64 and aarch64
