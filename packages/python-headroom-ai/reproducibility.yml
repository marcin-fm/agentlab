selected_surface:
  python: upstream base project plus mcp extra
  native_features:
    - extension-module
  disabled_native_defaults:
    - ml, including fastembed, Magika, and ORT, removed from selected Cargo metadata
    - Redis removed from selected Cargo metadata
  license_workspace:
    - crates/headroom-core
    - crates/headroom-py
  runtime_surface:
    - full upstream CLI and proxy commands are installed
    - stdio and streamable HTTP MCP transports are available
    - proxy fallback, update checks, file-read opt-in, and hf-hub capability remain available
    - these are documented upstream runtime behaviors, not build-time network access
    - FastAPI is required because upstream CLI registration imports proxy request-scope types
