  cargo_resolution: 307 resolved packages; 217 unique package/version records across 391 target-all normal tree entries
  source_license_probe: fastembed, Magika, ORT, and Redis are absent; ICU4X and the exact tree-sitter grammar set are selected
  unicode_license_probe: regex-syntax 0.8.11 bundles generated Unicode tables and includes src/unicode_tables/LICENSE-UNICODE while Cargo metadata declares only MIT OR Apache-2.0
  buildroot_license_probe: normalize cargo2rpm's headroom-core sibling path, compare the complete generated 172-record set with Source2's auditable common-plus-family inventory and digest, retain Source1 as the 217-record all-target source audit, and install the verified regex-syntax Unicode text
  ml_only_test_gate: kompress_parity declares required-features = ["ml"] and the full non-ML Cargo integration-test surface remains selected
  parity_fixture_gate: exact release commit archive reproducibly generates a fixture-only Source3 with 30 JSON fixtures totaling 84,202 bytes, LICENSE, NOTICE, provenance, and canonical manifest SHA-256 f5fef19e35104e7bcca2c89d604ca5288d6da7045386f07f3998ffc37e63a5e8
  sqlite_ttl_test_gate: test-only pre-expiry sleep is 500 ms and the 2,600 ms absolute-lifetime assertion remains unchanged
  license_macro_redirection: canonical braced cargo_license expansion writes ../../LICENSE.dependencies
  system_sqlite_probe: target checks require the Rust CCR test binary to link Fedora libsqlite3 and the installed Python backend to open a database
  extension_dynamic_probe: target checks reject RPATH or RUNPATH; unused Rust CCR code may be dead-stripped from the extension
  installed_smoke: target checks verify PyInit__core, import the buildroot package in safe-path mode, and run headroom --help
  target_build_required: regenerate LICENSE.dependencies, run Cargo/Python/SQLite/ELF smokes, and complete all six targets
