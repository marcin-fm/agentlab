schema: agentlab-target-applicability/v1

roots:
  ast-grep:
    kind: application
    releases: ["43", "44", rawhide]
    reason: Selected native ast-grep CLI application.
  rtk:
    kind: application
    releases: ["43", "44", rawhide]
    reason: Selected native RTK CLI application.
  agent-browser:
    kind: application
    releases: ["43", "44", rawhide]
    reason: Selected native browser automation CLI requires the architecture-symmetric default matrix.
  rubygem-ferrum:
    kind: core
    releases: ["43", "44", rawhide]
    reason: Selected reusable browser-control runtime for the maintained tool surface.
  python-docling-core:
    kind: core
    releases: ["43", "44", rawhide]
    reason: Maintainer-designated Docling core package for the complete default matrix.
selected_consumers:
  bun:
    releases: ["43", "44", rawhide]
    reason: Source-built Bun is selected with a Fedora system lol-html dependency.
  nodejs-playwright:
    releases: ["43", "44", rawhide]
    reason: Released source-build dependency closure selected for the blocked reusable Playwright module.
  python-headroom-ai:
    releases: ["43", "44", rawhide]
    reason: Released dependency closure selected for the enabled non-ML Headroom surface.
  python-docling-mcp:
    releases: ["43", "44", rawhide]
    reason: Selected Docling MCP application retained as a blocked consumer pending an upstream-supported package surface.
  python-serena-agent:
    releases: ["43", "44", rawhide]
    reason: Maintainer-designated full-family Serena package retained as a blocked selected consumer pending an upstream-supported surface.

